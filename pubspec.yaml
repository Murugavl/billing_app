name: rasidhu
description: "Offline-first billing and invoicing app for small businesses — Rasidhu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database — drift (schema migrations, type-safe queries)
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # State management — Riverpod
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.5.0

  # PDF generation & printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # File system
  path_provider: ^2.1.3
  path: ^1.9.0

  # Sharing
  share_plus: ^13.3.0

  # Internationalisation (currency + date formatting — default INR)
  intl: ^0.20.3

  # Image picking (for business logo, product images)
  image_picker: ^1.1.2

  # Contact picker (Pick from Contacts on Add Customer screen)
  flutter_contacts: ^1.1.9+2
  # Runtime permission status check (non-prompting check for READ_CONTACTS)
  permission_handler: ^11.3.1

  # Google Fonts (Inter for professional typography)
  google_fonts: ^8.2.1
  shared_preferences: ^2.2.3

  # Google Sign-In & Google Drive API (appDataFolder scope)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Client-side AES-256 encryption & PBKDF2 key derivation
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Background task scheduler
  workmanager: ^0.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for drift + riverpod
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf

